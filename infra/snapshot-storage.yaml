AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private lightwalletd snapshot storage with public CloudFront downloads — immutable
  timestamped objects are published before a mutable latest manifest.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: EC2 source host -> private S3 -> public CloudFront; lifecycle bounds retention; latest.json is publish commit point
    must:
      - Bucket stays private and TLS-only
      - Public reads reach S3 only through the stack CloudFront distribution
      - Snapshot bucket survives stack deletion or replacement
    ref:
      - at: docs/how-snapshots-work.md
        has: Snapshot consistency, restore, and security model
        scope: repository

Parameters:
  PublisherRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$'
    Description: Existing EC2 instance role allowed to publish snapshots.
  SnapshotRetentionDays:
    Type: Number
    Default: 14
    MinValue: 2
    MaxValue: 365
    Description: Days to retain timestamped snapshot objects.
  SnapshotPrefix:
    Type: String
    Default: mainnet/v0.5.4
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: S3 key prefix reserved for this publisher.

Resources:
  SnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: durable source of published snapshots; Standard class keeps current restore immediately downloadable
        must:
          - Never expose bucket directly to public writes or reads
          - Retain on stack delete/replace; data deletion is a separate operator action
          - Expire only timestamped snapshots; preserve latest.json
        mutable: change-with-constraints
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTimestampedSnapshots
            Status: Enabled
            Prefix: !Sub '${SnapshotPrefix}/snapshots/'
            ExpirationInDays: !Ref SnapshotRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 2
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            Prefix: ''
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireOldLatestManifestVersions
            Status: Enabled
            Prefix: !Sub '${SnapshotPrefix}/latest.json'
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Project
          Value: lightwalletd-snapshots
        - Key: ManagedBy
          Value: CloudFormation

  SnapshotBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: defense-in-depth transport enforcement for all bucket operations
        must:
          - Keep aws:SecureTransport deny for bucket and objects
    Properties:
      Bucket: !Ref SnapshotBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SnapshotBucket.Arn
              - !Sub '${SnapshotBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowPublisherRole
            Effect: Allow
            Principal:
              AWS: !Ref PublisherRoleArn
            Action:
              - s3:AbortMultipartUpload
              - s3:GetObject
              - s3:ListMultipartUploadParts
              - s3:PutObject
            Resource: !Sub '${SnapshotBucket.Arn}/${SnapshotPrefix}/*'
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SnapshotBucket.Arn}/${SnapshotPrefix}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SnapshotDistribution}'

  SnapshotOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: authenticate CloudFront origin reads while S3 Block Public Access stays enabled
        must:
          - Sign every origin request with SigV4
        mutable: change-with-constraints
    Properties:
      OriginAccessControlConfig:
        Description: Read-only access from the snapshot CloudFront distribution to private S3
        Name: !Sub '${AWS::StackName}-snapshots'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SnapshotDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: stable HTTPS download endpoint; cache immutable archives while always revalidating latest.json
        must:
          - Use OAC; never make the S3 origin public
          - latest.json must use the disabled-cache behavior
          - Only GET, HEAD, and OPTIONS are viewer-accessible
        mutable: change-with-constraints
    Properties:
      DistributionConfig:
        Comment: Public lightwalletd snapshot downloads
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SnapshotBucket.RegionalDomainName
            Id: SnapshotS3Origin
            OriginAccessControlId: !GetAtt SnapshotOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: false
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          TargetOriginId: SnapshotS3Origin
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - PathPattern: !Sub '${SnapshotPrefix}/latest.json'
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            TargetOriginId: SnapshotS3Origin
            ViewerProtocolPolicy: redirect-to-https
        PriceClass: PriceClass_200
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  SnapshotBucketName:
    Description: Private bucket containing snapshot artifacts and latest manifest.
    Value: !Ref SnapshotBucket
  SnapshotPrefix:
    Description: Key prefix granted to the publisher role.
    Value: !Ref SnapshotPrefix
  SnapshotDownloadDomain:
    Description: Public HTTPS domain for snapshot manifests and artifacts.
    Value: !GetAtt SnapshotDistribution.DomainName
  LatestManifestUrl:
    Description: Public URL for the current snapshot manifest.
    Value: !Sub 'https://${SnapshotDistribution.DomainName}/${SnapshotPrefix}/latest.json'
