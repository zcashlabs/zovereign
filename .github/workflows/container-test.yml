name: Build, test, and publish container

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays at 00:00 UTC
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .env.example
      - docker/**
      - tests/**
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
      - .github/workflows/container-test.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .env.example
      - docker/**
      - tests/**
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
      - .github/workflows/container-test.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate local deployment configuration
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build pinned runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: zovereign:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Verify architecture and test the bundled runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "zovereign:ci-$ARCH")" = "linux/$ARCH"
          docker run --rm -i --platform "linux/$ARCH" --entrypoint python3 \
            -e STACK_MODULE=/opt/zovereign/stack.py \
            "zovereign:ci-$ARCH" - -v < "$GITHUB_WORKSPACE/tests/test_stack.py"
      - name: Verify structured runtime progress
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -i --platform "linux/$ARCH" --entrypoint python3 \
            -e STACK_MODULE=/opt/zovereign/stack.py \
            "zovereign:ci-$ARCH" - -v < "$GITHUB_WORKSPACE/tests/test_cli_progress.py"
      - name: Export tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "zovereign:ci-$ARCH" -o "$RUNNER_TEMP/image-$ARCH.tar"
      - name: Upload tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish multi-platform image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exactly the tested images and assemble the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # A delayed run or retry can refer to an older main commit.
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              echo 'Skipped weekly publication because main advanced.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            tag="weekly-$(date -u +%F)"
          fi
          for arch in amd64 arm64; do
            docker load -i "$RUNNER_TEMP/images/image-$arch.tar"
            docker tag "zovereign:ci-$arch" "$image:$tag-$arch"
            docker push "$image:$tag-$arch"
          done
          docker buildx imagetools create \
            --tag "$image:$tag" "$image:$tag-amd64" "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag" --raw > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as source:
              manifest = json.load(source)
          platforms = {(entry['platform']['os'], entry['platform']['architecture']) for entry in manifest['manifests']}
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          PYTHON
          docker buildx imagetools create --tag "$image:latest" "$image:$tag"
          printf 'Published `%s:%s` and `latest` for Linux amd64 and arm64 from commit `%s`.\n' \
            "$image" "$tag" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
