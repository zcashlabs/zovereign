name: Publish daily lightwalletd snapshot

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightwalletd-mainnet-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: [self-hosted, linux, x64, lightwalletd-snapshot]
    timeout-minutes: 180
    env:
      CONTAINER_NAME: lightwalletd
      DATA_DIR: /var/lib/lightwalletd
      LIGHTWALLETD_VERSION: v0.6.0
      EXPECTED_IMAGE: electriccoinco/lightwalletd:v0.6.0@sha256:abc8199dae800e050415a3459f71c7850aeefeb1ca6a681e9b9eda7249ce8613
      QUIESCE_MODE: pause
      SNAPSHOT_DIR: /srv/lightwalletd/snapshots
      PUBLIC_BASE_URL: https://165-232-183-161.sslip.io

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Preflight source and storage
        run: |
          set -Eeuo pipefail
          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true
          test "$(df --output=avail -B1 /srv/lightwalletd | tail -n 1)" -ge 53687091200
          mkdir -p "$SNAPSHOT_DIR"

      - name: Create consistent snapshot
        id: create
        run: ./scripts/create-snapshot.sh "$SNAPSHOT_DIR"

      - name: Publish snapshot from the DigitalOcean volume
        env:
          RETAIN_ARCHIVES: '3'
        run: ./scripts/publish-local.sh "${{ steps.create.outputs.archive_path }}"

      - name: Verify source recovered
        if: always()
        run: |
          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true
          docker logs --tail 20 "$CONTAINER_NAME"
