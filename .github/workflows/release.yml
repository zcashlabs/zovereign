name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main and an unused stable version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable version such as v0.1.0.'
            exit 1
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" \
            --jq 'map(select(.ref == ("refs/tags/" + env.VERSION))) | length')
          if [ "$existing" != 0 ]; then
            echo '::error::That version already has a Git tag. Choose a new version.'
            exit 1
          fi

  build:
    name: Build, test, and publish
    needs: validate
    uses: ./.github/workflows/container-test.yml
    permissions:
      contents: read
      actions: read
      packages: write

  cli:
    name: Test and build release binaries
    needs: validate
    uses: ./.github/workflows/cli-test.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Create GitHub Release
    needs: [build, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: zovereign-*
          path: cli-artifacts
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Package and sign the four tested CLI binaries
        run: |
          set -Eeuo pipefail
          mkdir dist
          for entry in \
            linux-amd64:x86_64-unknown-linux-musl linux-arm64:aarch64-unknown-linux-musl \
            darwin-amd64:x86_64-apple-darwin darwin-arm64:aarch64-apple-darwin; do
            install -m 755 "cli-artifacts/zovereign-${entry#*:}/zovereign" "dist/zovereign-$VERSION-${entry%:*}"
          done
          cd dist
          sha256sum zovereign-* > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Install and run the signed CLI before publication
        if: github.repository == 'zcashlabs/zovereign'
        env:
          ZOVEREIGN_SIGNED_DIST: ${{ github.workspace }}/dist
          RELEASE_TAG: ${{ inputs.version }}
        run: python3 tests/test_cli_installer.py Installer.test_signed_release -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested multi-platform image
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:$VERSION" "$image:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$image:$VERSION" --raw > "$RUNNER_TEMP/release-manifest.json"
          python3 - "$RUNNER_TEMP/release-manifest.json" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as source:
              manifest = json.load(source)
          platforms = {(entry['platform']['os'], entry['platform']['architecture']) for entry in manifest['manifests']}
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          PYTHON
      - name: Write release notes
        run: |
          python3 <<'PYTHON'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          image = f"ghcr.io/{repo.lower()}"
          sha = os.environ['GITHUB_SHA']
          server = os.environ['GITHUB_SERVER_URL']
          run = os.environ['GITHUB_RUN_ID']
          cli = "Download the CLI binary for your platform and verify it against the signed SHA256SUMS manifest."
          if repo == 'zcashlabs/zovereign':
              cli = f"""Install the verified CLI on the Mac or Linux host that will run the node:

          ```bash
          installer=$(curl -fsSL --proto '=https' --proto-redir '=https' https://raw.githubusercontent.com/{repo}/{sha}/scripts/install-cli.sh) && /bin/sh -c "$installer" sh {version}
          ```

          Open a fresh terminal or SSH session and run `zovereign` for guided setup."""
          notes = f"""Run your own Zcash archive node and lightwalletd in one Docker container, restored from published mainnet snapshots.

          **Platforms:** Linux AMD64 and ARM64. Docker selects your architecture automatically. macOS and Windows use Docker Desktop's Linux containers.

          ```bash
          docker pull {image}:{version}
          ```

          Follow the [startup and deployment guide]({server}/{repo}/blob/{version}/docs/single-container.md) to run the image with a persistent data volume.

          - Zakura 1.8.7, mainnet archive database major 30.
          - lightwalletd v0.6.0, connected to the bundled node's private RPC.
          - Bootstrap, lifecycle and bundled-binary tests run natively on both architectures.
          - Full mainnet restore has been verified on Linux AMD64. ARM64 and Docker Desktop full-mainnet validation is still pending.

          {cli}

          [Build and test run]({server}/{repo}/actions/runs/{run}) · [Source commit]({server}/{repo}/commit/{sha})
          """
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes)
          PYTHON
      - name: Publish GitHub Release
        run: |
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Zovereign $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          printf 'GitHub Release: %s/%s/releases/tag/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
